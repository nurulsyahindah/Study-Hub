<!-- LOGIN PAGE -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Hub Login</title>

  <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
    rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
    crossorigin="anonymous">

    <!-- Font-Awesome CDN-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <!-- External CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body id="biru">
<div class="form-container">
    <h1 class="text-center"> Study Hub Login</h1><br>
        <div class="form-box">
            <form id="form" action="">                
                
                <div class="row" >
                        <label for="email">Email</label>
                        <input type="text" placeholder="Ex: abc@example.com" id="email">
                        <small id="email-error">Error</small>
                        <i class="fa-solid fa-circle-check"></i>
                        <i class="fa-solid fa-circle-exclamation"></i>
                </div>

                <div class="row">
                        <label for="password">Password</label>
                        <input type="password" placeholder="********" id="password" autocomplete="off">
                        <small id="password-error">Error</small>
                        <i class="fa-solid fa-circle-check"></i>
                        <i class="fa-solid fa-circle-exclamation"></i>
                </div>

                <div class="text-end">
                         <button type="submit" class="btn btn-primary btn-sm">
    Login
</button>
                </div>            
            </form>
        </div>
</div>

<!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
    crossorigin="anonymous"></script>

    <!-- Vanta Background-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    <script>
    VANTA.NET({
    el: "#biru",
    mouseControls: true,
    touchControls: true,
    gyroControls: false,
    minHeight: 200.00,
    minWidth: 200.00,
    scale: 1.00,
    scaleMobile: 1.00
    })
    </script>

<!-- External JavaScript -->
<script src="js/script.js"></script>

</body>
</html>
